site_name: tracemelt
site_url: https://sunilbittu.github.io/observability-lens/
repo_url: https://github.com/sunilbittu/observability-lens

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
  - Using tracemelt:
      - Web UI: using-tracemelt/ui.md
  - Reference:
      - Query API: api/query-api.md
      - Configuration: reference/configuration.md
  - Project:
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
      - "ADR 0001: schema-init job": project/adr/0001-schema-init-job.md
