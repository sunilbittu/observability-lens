site_name: tracemelt
site_url: https://sunilbittu.github.io/observability-lens/
repo_url: https://github.com/sunilbittu/observability-lens

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
  - Instrumentation:
      - Node.js and Python SDKs: instrumentation/sdks.md
  - Using tracemelt:
      - Web UI: using-tracemelt/ui.md
  - Alerting:
      - Rules and limitations: alerting/rules.md
  - Operations:
      - Self-observability and data handling: operations/self-observability.md
      - Back up and restore: operations/backup-and-restore.md
  - Reference:
      - Query API: api/query-api.md
      - Configuration: reference/configuration.md
  - Project:
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
      - "ADR 0001: schema-init job": project/adr/0001-schema-init-job.md
      - "ADR 0002: alert rules in a file": project/adr/0002-alert-rules-file.md
