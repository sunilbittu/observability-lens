site_name: observability-lens
site_url: https://sunilbittu.github.io/observability-lens/
repo_url: https://github.com/sunilbittu/observability-lens

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Roadmap: roadmap.md