site_name: tracemelt
site_url: https://sunilbittu.github.io/observability-lens/
repo_url: https://github.com/sunilbittu/observability-lens

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
  - Project:
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
