name: docs-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main branch
        run: git fetch origin main --depth=1 || true

      - name: Deploy dev docs from main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev
          # Until a tagged release publishes "latest", point the site root at dev
          if ! mike list | grep -q latest; then
            mike set-default --push dev
          fi

      - name: Deploy release docs from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest