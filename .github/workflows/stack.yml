name: stack

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "deploy/**"
      - "api/**"
      - "demo/**"
      - "scripts/init-env.sh"
      - "scripts/smoke.sh"
      - "scripts/outage-test.sh"
      - ".github/workflows/stack.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "deploy/**"
      - "api/**"
      - "scripts/init-env.sh"
      - "scripts/smoke.sh"
      - "scripts/outage-test.sh"

jobs:
  api-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: api

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets
        run: scripts/init-env.sh

      - name: Start stack
        run: docker compose --profile demo up -d --build

      - name: Wait for collector
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13133)" = 200 ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test
        run: scripts/smoke.sh

      - name: Outage test (60 second outage)
        run: scripts/outage-test.sh 60

      - name: Logs on failure
        if: failure()
        run: docker compose logs
