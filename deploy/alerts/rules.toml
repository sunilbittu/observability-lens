# tracemelt alert rules. Status: prototype.
# Edit this file, then restart the alerts service: docker compose restart alerts
# Reference and limitations: docs/alerting/rules.md
#
# The rules below match the demo workload (docker compose --profile demo) and send to its
# webhook receiver. Replace them with your own.

[[rule]]
name = "payments-failed-spans"
signal = "error_spans"
service = "payments"
comparator = ">"
threshold = 5
window_seconds = 60
cooldown_seconds = 300
webhook_url = "http://webhook-sink:8080/alerts"

[[rule]]
name = "checkout-failure-logs"
signal = "log_count"
service = "storefront"
search = "checkout failed"
severity = "ERROR"
comparator = ">"
threshold = 5
window_seconds = 60
cooldown_seconds = 300
webhook_url = "http://webhook-sink:8080/alerts"

# metric_avg averages every data point in the window. Always set service: without it the
# average runs across the whole fleet and one overloaded service is hidden by the others.
[[rule]]
name = "payments-queue-depth"
signal = "metric_avg"
metric = "queue.depth"
service = "payments"
comparator = ">"
threshold = 20
window_seconds = 60
cooldown_seconds = 300
webhook_url = "http://webhook-sink:8080/alerts"

# --- the platform watching itself -------------------------------------------------
# These use metrics the collector reports about itself and scrapes from ClickHouse.

# Batches are waiting on disk because ClickHouse is slow or down. Data is dropped after
# 10 minutes of failed retries, so this is the warning that loss is approaching.
[[rule]]
name = "collector-export-queue-backlog"
signal = "metric_avg"
metric = "otelcol_exporter_queue_size"
service = "otelcol-contrib"
comparator = ">"
threshold = 50
window_seconds = 120
cooldown_seconds = 600
webhook_url = "http://webhook-sink:8080/alerts"

# Less than 10 GiB free where ClickHouse keeps its data. This is an absolute number of
# bytes because there is no ratio signal yet: set it to about 20% of your disk.
[[rule]]
name = "clickhouse-disk-low"
signal = "metric_avg"
metric = "ClickHouseAsyncMetrics_FilesystemMainPathAvailableBytes"
service = "tracemelt-clickhouse"
comparator = "<"
threshold = 10737418240
window_seconds = 300
cooldown_seconds = 3600
webhook_url = "http://webhook-sink:8080/alerts"

# Many parts in one partition means merges are not keeping up with inserts.
[[rule]]
name = "clickhouse-too-many-parts"
signal = "metric_avg"
metric = "ClickHouseAsyncMetrics_MaxPartCountForPartition"
service = "tracemelt-clickhouse"
comparator = ">"
threshold = 150
window_seconds = 300
cooldown_seconds = 3600
webhook_url = "http://webhook-sink:8080/alerts"

# Used by scripts/smoke.sh to prove a rule fires and its webhook is delivered.
[[rule]]
name = "smoke-delivered"
signal = "log_count"
search = "tracemelt-smoke-alert"
comparator = ">"
threshold = 0
window_seconds = 60
cooldown_seconds = 0
webhook_url = "http://webhook-sink:8080/alerts"

# Used by scripts/smoke.sh to prove the cloud metadata address is refused.
[[rule]]
name = "smoke-blocked"
signal = "log_count"
search = "tracemelt-smoke-alert"
comparator = ">"
threshold = 0
window_seconds = 60
cooldown_seconds = 0
webhook_url = "http://169.254.169.254/latest/meta-data/"
