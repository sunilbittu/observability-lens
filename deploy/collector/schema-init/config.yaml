# Used only by the schema-init job. Listens on loopback inside its own container
# and never receives data; it exists so the exporter runs its DDL.
extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: ${env:TRACEMELT_CLICKHOUSE_DB}
    username: ${env:TRACEMELT_CLICKHOUSE_USER}
    password: ${env:TRACEMELT_CLICKHOUSE_PASSWORD}
    create_schema: true
    ttl: ${env:TRACEMELT_RETENTION}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      exporters: [clickhouse]
