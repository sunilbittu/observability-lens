# tracemelt collector. Status: prototype.
# OTLP in (bearer token required) -> ClickHouse. The clickhouse exporter owns the otel_* tables.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth:
    scheme: Bearer
    token: ${env:TRACEMELT_INGEST_TOKEN}
  file_storage:
    directory: /var/lib/otelcol/queue

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304
        auth:
          authenticator: bearertokenauth

  # The platform watching itself: the collector's own metrics and a short list of
  # ClickHouse metrics. These receivers are internal and take nothing from the network.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: tracemelt-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8888"]
        - job_name: tracemelt-clickhouse
          scrape_interval: 30s
          static_configs:
            - targets: ["clickhouse:9363"]
          metric_relabel_configs:
            # ClickHouse exposes hundreds of series. Keep the few that say whether storage is healthy.
            - source_labels: [__name__]
              regex: "ClickHouseAsyncMetrics_(FilesystemMainPath(Available|Total|Used)Bytes|MaxPartCountForPartition|Uptime)|ClickHouseMetrics_(Query|Merge|DelayedInserts)"
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    timeout: 5s
    send_batch_size: 5000
    send_batch_max_size: 10000

  # Default data protection. Attribute values are masked when the key looks sensitive,
  # and card numbers and bearer tokens are masked wherever they appear in an attribute
  # value or a log body.
  redaction:
    allow_all_keys: true
    blocked_key_patterns:
      - "(?i).*(authorization|cookie|passw(or)?d|secret|api[_.-]?key|cvv|cvc|card[_.-]?(number|no)).*"
      # "token" and "ssn" only as a whole word, so counters such as gen_ai.usage.input_tokens are kept.
      - "(?i)^(.*[._-])?(token|ssn)([._-].*)?$"
    blocked_values:
      - "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}"
      - "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\\b"
    summary: silent

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: ${env:TRACEMELT_CLICKHOUSE_DB}
    username: ${env:TRACEMELT_CLICKHOUSE_USER}
    password: ${env:TRACEMELT_CLICKHOUSE_PASSWORD}
    # The schema-init job creates the tables. With this off, the collector can
    # start, accept data and queue it while ClickHouse is down.
    create_schema: false
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 600s

service:
  extensions: [health_check, bearertokenauth, file_storage]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp, prometheus/self]
      processors: [memory_limiter, redaction, batch]
      exporters: [clickhouse]
