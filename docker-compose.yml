name: tracemelt

# Single-node development stack. Status: prototype.
# Secrets come from .env (create it with scripts/init-env.sh). Nothing here has a default password.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.48.11
    environment:
      CLICKHOUSE_DB: ${TRACEMELT_CLICKHOUSE_DB:-otel}
      CLICKHOUSE_USER: ${TRACEMELT_CLICKHOUSE_USER:?run scripts/init-env.sh}
      CLICKHOUSE_PASSWORD: ${TRACEMELT_CLICKHOUSE_PASSWORD:?run scripts/init-env.sh}
      # Read by deploy/clickhouse/reader.xml for the query API's read-only user.
      TRACEMELT_CLICKHOUSE_READER_PASSWORD: ${TRACEMELT_CLICKHOUSE_READER_PASSWORD:?run scripts/init-env.sh}
      TRACEMELT_CLICKHOUSE_READER_GRANT: GRANT SELECT ON ${TRACEMELT_CLICKHOUSE_DB:-otel}.*
      # Read by deploy/clickhouse/alert.xml for the alert engine's user.
      TRACEMELT_CLICKHOUSE_ALERT_PASSWORD: ${TRACEMELT_CLICKHOUSE_ALERT_PASSWORD:?run scripts/init-env.sh}
      TRACEMELT_CLICKHOUSE_ALERT_GRANT: GRANT INSERT, CREATE TABLE ON ${TRACEMELT_CLICKHOUSE_DB:-otel}.alert_events
    # No published ports: ClickHouse is reachable only on the compose network.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/reader.xml:/etc/clickhouse-server/users.d/tracemelt-reader.xml:ro
      - ./deploy/clickhouse/alert.xml:/etc/clickhouse-server/users.d/tracemelt-alert.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The collector image runs as uid 10001 and has no shell, so a one-shot
  # container makes the queue volume writable for it.
  collector-queue-init:
    image: busybox:1.37.0
    command: ["chown", "-R", "10001:10001", "/var/lib/otelcol/queue"]
    volumes:
      - collector-queue:/var/lib/otelcol/queue

  # Runs the exporter's own DDL once per `up`, then exits. Keeps the schema
  # exporter-owned while letting the long-running collector start without ClickHouse.
  schema-init:
    build: ./deploy/collector/schema-init
    image: tracemelt/schema-init:0.166.0
    environment:
      TRACEMELT_CLICKHOUSE_DB: ${TRACEMELT_CLICKHOUSE_DB:-otel}
      TRACEMELT_CLICKHOUSE_USER: ${TRACEMELT_CLICKHOUSE_USER:?run scripts/init-env.sh}
      TRACEMELT_CLICKHOUSE_PASSWORD: ${TRACEMELT_CLICKHOUSE_PASSWORD:?run scripts/init-env.sh}
      TRACEMELT_RETENTION: ${TRACEMELT_RETENTION:-72h}
    depends_on:
      clickhouse:
        condition: service_healthy

  collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      TRACEMELT_INGEST_TOKEN: ${TRACEMELT_INGEST_TOKEN:?run scripts/init-env.sh}
      TRACEMELT_CLICKHOUSE_DB: ${TRACEMELT_CLICKHOUSE_DB:-otel}
      TRACEMELT_CLICKHOUSE_USER: ${TRACEMELT_CLICKHOUSE_USER:?run scripts/init-env.sh}
      TRACEMELT_CLICKHOUSE_PASSWORD: ${TRACEMELT_CLICKHOUSE_PASSWORD:?run scripts/init-env.sh}
      GOMEMLIMIT: 400MiB
    mem_limit: 512m
    volumes:
      - ./deploy/collector/config.yaml:/etc/otelcol/config.yaml:ro
      - collector-queue:/var/lib/otelcol/queue
    ports:
      # Bound to loopback by default. Put TLS in front before binding wider.
      - "${TRACEMELT_BIND:-127.0.0.1}:${TRACEMELT_OTLP_GRPC_PORT:-4317}:4317"
      - "${TRACEMELT_BIND:-127.0.0.1}:${TRACEMELT_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${TRACEMELT_COLLECTOR_HEALTH_PORT:-13133}:13133"
    depends_on:
      clickhouse:
        condition: service_healthy
      collector-queue-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: ./api
    image: tracemelt/api:dev
    environment:
      TRACEMELT_API_TOKEN: ${TRACEMELT_API_TOKEN:?run scripts/init-env.sh}
      TRACEMELT_CLICKHOUSE_HOST: clickhouse
      TRACEMELT_CLICKHOUSE_DB: ${TRACEMELT_CLICKHOUSE_DB:-otel}
      TRACEMELT_CLICKHOUSE_READER_USER: tracemelt_reader
      TRACEMELT_CLICKHOUSE_READER_PASSWORD: ${TRACEMELT_CLICKHOUSE_READER_PASSWORD:?run scripts/init-env.sh}
      # Set to 1 when the UI is served over HTTPS so the session cookie is marked Secure.
      TRACEMELT_COOKIE_SECURE: ${TRACEMELT_COOKIE_SECURE:-0}
    mem_limit: 256m
    read_only: true
    ports:
      # Loopback only. The bearer token is a temporary guard, not a login system.
      - "127.0.0.1:${TRACEMELT_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # Evaluates deploy/alerts/rules.toml. Run exactly one: instances do not coordinate yet.
  alerts:
    build: ./api
    image: tracemelt/api:dev
    command: ["python", "-m", "app.alerts"]
    environment:
      TRACEMELT_CLICKHOUSE_HOST: clickhouse
      TRACEMELT_CLICKHOUSE_DB: ${TRACEMELT_CLICKHOUSE_DB:-otel}
      TRACEMELT_CLICKHOUSE_ALERT_USER: tracemelt_alert
      TRACEMELT_CLICKHOUSE_ALERT_PASSWORD: ${TRACEMELT_CLICKHOUSE_ALERT_PASSWORD:?run scripts/init-env.sh}
      TRACEMELT_ALERT_RULES: /etc/tracemelt/rules.toml
      TRACEMELT_ALERT_INTERVAL_SECONDS: ${TRACEMELT_ALERT_INTERVAL_SECONDS:-30}
      # Webhooks go only to these hosts. The second list names hosts that may resolve
      # to private addresses; every other host must resolve to public addresses.
      TRACEMELT_WEBHOOK_ALLOWED_HOSTS: ${TRACEMELT_WEBHOOK_ALLOWED_HOSTS:-webhook-sink}
      TRACEMELT_WEBHOOK_PRIVATE_HOSTS: ${TRACEMELT_WEBHOOK_PRIVATE_HOSTS:-webhook-sink}
    volumes:
      - ./deploy/alerts/rules.toml:/etc/tracemelt/rules.toml:ro
    mem_limit: 128m
    read_only: true
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional sample workload: docker compose --profile demo up -d
  demo:
    profiles: [demo]
    image: python:3.12.16-slim-bookworm
    command: ["python", "-u", "/demo/generate.py"]
    environment:
      TRACEMELT_ENDPOINT: http://collector:4318
      TRACEMELT_INGEST_TOKEN: ${TRACEMELT_INGEST_TOKEN:?run scripts/init-env.sh}
    volumes:
      - ./demo/generate.py:/demo/generate.py:ro
    user: "10001:10001"
    read_only: true
    mem_limit: 64m
    depends_on:
      - collector
    restart: unless-stopped

  # Receives the demo alert webhooks and prints them. Not published to the host.
  webhook-sink:
    profiles: [demo]
    image: python:3.12.16-slim-bookworm
    command: ["python", "-u", "/demo/webhook_sink.py"]
    volumes:
      - ./demo/webhook_sink.py:/demo/webhook_sink.py:ro
    user: "10001:10001"
    read_only: true
    mem_limit: 64m
    restart: unless-stopped

volumes:
  clickhouse-data:
  collector-queue:
